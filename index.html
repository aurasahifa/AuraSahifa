<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuraSahifa — jonli obunaçilar</title>
<link href="https://fonts.googleapis.com/css2?family=Belleza&family=Jost:wght@300;400&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Mont";src:local("Mont"),local("Mont Heavy"),url(fonts/Mont.woff2) format("woff2"),url(fonts/Mont.otf) format("opentype"),url(fonts/Mont.ttf) format("truetype");font-weight:100 900}
@font-face{font-family:"Sahar";src:local("Sahar"),url(fonts/Sahar.woff2) format("woff2"),url(fonts/Sahar.otf) format("opentype"),url(fonts/Sahar.ttf) format("truetype");font-weight:100 900}
:root{--bg:#271b11;--line:#4a3323;--text:#f3e6d3;--muted:#b9a38a;--gold1:#f3e6d3;--gold2:#d9c8ac;--gold3:#8f7e66;--cream1:#f7ecd8;--cream2:#e3cfae;--ink:#2a1b0f;
--f-title:"Belleza",Georgia,serif;--f-ui:"Mont","Montserrat",system-ui,sans-serif;--f-soft:"Sahar","Jost","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{font-family:var(--f-ui);font-size:15px;color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg) var(--bgimg) center/cover no-repeat}
.wrap{max-width:520px;margin:0 auto;padding:26px 18px 56px}
.logo{display:block;width:min(58%,230px);height:auto;margin:4px auto 14px}
h1{font:400 clamp(1.85rem,7.8vw,2.35rem)/1.15 var(--f-soft);text-align:center;letter-spacing:.01em}
.lead{font-family:var(--f-soft);color:var(--muted);text-align:center;font-size:1.08rem;margin:10px auto 0}
.card{margin-top:22px;padding:20px 18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,#2b1c13ee,#1f140eee);box-shadow:0 24px 40px -22px #000}
.result{font:400 1.4rem/1.2 var(--f-title);color:var(--gold1);text-align:center;white-space:nowrap;overflow:hidden}
.sub{font-family:var(--f-soft);text-align:center;color:var(--muted);font-size:.8rem;margin:4px 0 10px}
input[type=range]{width:100%;height:32px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--gold2) var(--p,0%),#3b261b var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#3b261b}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--gold2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;border:2px solid var(--gold3);background:radial-gradient(circle at 35% 30%,#fffaf0,#e6d6bc 55%,#9b8a70);box-shadow:0 3px 8px #000a}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;border:2px solid var(--gold3);background:radial-gradient(circle at 35% 30%,#fffaf0,#e6d6bc 55%,#9b8a70)}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 20px}
.chip{padding:8px 0 7px;border-radius:12px;border:1px solid var(--line);background:#2f1d14;color:var(--text);font:700 .82rem var(--f-ui);cursor:pointer;line-height:1.25}
.chip small{display:block;font-weight:400;font-size:.64rem;color:var(--muted)}
.chip.on{border-color:var(--gold2);color:var(--gold1);background:#3a2518}
label{display:block;font:600 .78rem var(--f-ui);margin-bottom:6px;color:var(--muted)}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#150c08;color:var(--text);font:400 .92rem var(--f-ui)}
.field:focus,.chip:focus-visible,.btn:focus-visible,.x:focus-visible,.tg:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
.err{color:#ff9d8a;font-size:.8rem;min-height:1.1em;margin-top:6px}
.btn{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;cursor:pointer;text-align:center;text-decoration:none;font:800 1rem var(--f-ui);letter-spacing:-.02em;color:var(--ink);background:linear-gradient(110deg,var(--cream2),var(--cream1));box-shadow:0 6px 16px #0007;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.65;cursor:wait}
.tg{display:block;text-align:center;margin-top:20px;color:var(--gold1);font:.9rem var(--f-soft);text-decoration:none}
.ov{position:fixed;inset:0;background:#000c;display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.open{display:flex}
.modal{background:#2a1b12;border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:500px;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:600px){.ov{align-items:center}.modal{border-radius:22px}}
.mh{display:flex;justify-content:space-between;align-items:center}
.mh h2{font:400 1.4rem var(--f-title)}
.x{background:none;border:0;color:var(--muted);font-size:1.8rem;cursor:pointer;line-height:1}
.sum{margin:12px 0;padding:12px;border-radius:12px;background:#150c08;border:1px solid var(--gold3);text-align:center}
.sum span{display:block;color:var(--muted);font:.78rem var(--f-soft)}
.sum strong{font:400 1.7rem var(--f-title);color:var(--gold1)}
.cardrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;margin-bottom:8px;border-radius:12px;border:1px solid var(--line);background:#33211a}
.cardrow em{font-style:normal;font-size:.72rem;color:var(--muted);display:block}
.cardrow code{font:700 .98rem var(--f-ui);letter-spacing:.05em}
.copy{padding:7px 11px;border-radius:9px;border:1px solid var(--gold3);background:none;color:var(--gold1);font:600 .74rem var(--f-ui);cursor:pointer}
.hint{color:var(--muted);font:.82rem var(--f-soft);margin:10px 0 14px}
.prev{display:none;max-width:100%;max-height:160px;border-radius:10px;margin-top:10px}
.ok{text-align:center;padding:18px 0}
.ok h2{font:400 1.6rem var(--f-title);color:var(--gold1);margin-bottom:8px}
.ok p{color:var(--muted);font:.88rem var(--f-soft)}

h1{font:700 clamp(2rem,8.6vw,2.7rem)/1.1 var(--f-ui);letter-spacing:-.03em}
.lead{font:500 1.15rem/1.35 var(--f-ui)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes logoIn{from{opacity:0;transform:scale(.93);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes sheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(40px) scale(.98);opacity:0}}
@keyframes dash{to{stroke-dashoffset:0}}
@keyframes pop{50%{transform:scale(1.05)}}
.logo{animation:logoIn 1.2s cubic-bezier(.2,.7,.2,1) both}
h1{animation:rise .8s .55s both}.lead{animation:rise .8s .75s both}.card{animation:rise .9s .95s both}.tg{animation:rise .8s 1.3s both}
.chip{transition:transform .15s,border-color .25s,background .25s,color .25s}.chip:active{transform:scale(.95)}.chip.on{animation:pop .35s}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#fffb 50%,transparent 65%);transform:translateX(-130%);animation:sheen 5s 2.2s infinite}
.ov.open{animation:fade .3s}.ov.open .modal{animation:sheet .5s cubic-bezier(.2,.8,.2,1)}
.chk{display:block;width:64px;height:64px;margin:0 auto 12px;fill:none;stroke:var(--gold1);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chk circle{stroke-dasharray:152;stroke-dashoffset:152;animation:dash .8s .1s forwards}
.chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:dash .5s .7s forwards}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}.chk circle,.chk path{stroke-dashoffset:0}}
html,body{overflow-x:hidden}
@keyframes glow{50%{filter:drop-shadow(0 0 22px #f3e6d366)}}
.logo{animation:logoIn 1.2s cubic-bezier(.2,.7,.2,1) both,glow 3s 1s ease-in-out 1}
h1{font:400 clamp(2rem,9.5vw,3rem)/1.06 var(--f-title);letter-spacing:.04em;text-transform:uppercase;white-space:pre-line}
.result{font:700 1.15rem/1.25 var(--f-ui);letter-spacing:-.01em}
.sub{font-size:.92rem}
.logo{width:min(34%,128px);margin:0 auto 12px}
h1{font-size:clamp(2.4rem,11.6vw,3.6rem);line-height:1.04}
.lead{margin-top:14px}
.info{font:.84rem/1.5 var(--f-soft);color:var(--muted);text-align:center;max-width:38ch;margin:10px auto 0;animation:rise .8s 1.45s both}
.tg{line-height:1.4;padding:0 6px}
.mh h2{font:700 1.35rem var(--f-ui);letter-spacing:-.02em}
.sum strong{font:800 1.7rem var(--f-ui);letter-spacing:-.02em}
.ok h2{font:700 1.5rem var(--f-ui);letter-spacing:-.02em}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.pick{display:block;width:100%;padding:13px 14px;border-radius:12px;border:1px dashed var(--gold3);background:#150c08;color:var(--text);font:600 .9rem var(--f-ui);text-align:center;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vh:focus-visible+.pick{outline:2px solid var(--gold1);outline-offset:2px}

/* ===== Premium harakatlar ===== */
body::before{animation:drift 40s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:scale(1.08) translate3d(-1%,-1%,0)}}
@keyframes lineUp{to{transform:none}}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes glowPulse{50%{filter:drop-shadow(0 0 10px #f3e6d38c)}}
@keyframes rip{to{transform:scale(2.8);opacity:0}}
h1{animation:none}
.ln{display:block;overflow:hidden;padding:.04em 0 .1em;margin-bottom:-.1em}
.ln>span{display:block;transform:translateY(115%);animation:lineUp 1.1s cubic-bezier(.16,1,.3,1) both}
.logo{animation:logoIn 1.3s cubic-bezier(.16,1,.3,1) both,glow 3s 1s ease-in-out 1,float 7s 2.4s ease-in-out infinite alternate}
.card{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .95s both}
.tg{animation:rise 1s cubic-bezier(.16,1,.3,1) 1.3s both}
.info{animation:rise 1s cubic-bezier(.16,1,.3,1) 1.45s both}
.chip,.copy{position:relative;overflow:hidden}
.chip{opacity:0;transform:translateY(10px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s,color .3s}
.chip.show{opacity:1;transform:none}
.chip.show:active{transform:scale(.95);transition-duration:.12s}
.rip{position:absolute;border-radius:50%;background:#f3e6d3;opacity:.3;transform:scale(0);animation:rip .8s cubic-bezier(.2,.7,.2,1) forwards;pointer-events:none}
.btn .rip{background:#fff;opacity:.75}
input[type=range]::-webkit-slider-thumb{transition:transform .2s,box-shadow .2s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18);box-shadow:0 0 0 9px #f3e6d322,0 3px 10px #000a}
input[type=range]::-moz-range-thumb{transition:transform .2s}
input[type=range]:active::-moz-range-thumb{transform:scale(1.18)}
.ov{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov.open #pay>*{animation:rise .65s cubic-bezier(.16,1,.3,1) backwards}
.ov.open #pay>:nth-child(1){animation-delay:.1s}.ov.open #pay>:nth-child(2){animation-delay:.16s}.ov.open #pay>:nth-child(3){animation-delay:.22s}
.ov.open #pay>:nth-child(4){animation-delay:.28s}.ov.open #pay>:nth-child(5){animation-delay:.34s}.ov.open #pay>:nth-child(6){animation-delay:.4s}
.ov.open #pay>:nth-child(7){animation-delay:.4s}.ov.open #pay>:nth-child(8){animation-delay:.46s}.ov.open #pay>:nth-child(9){animation-delay:.5s}.ov.open #pay>:nth-child(10){animation-delay:.54s}
.chk{animation:glowPulse 2.6s 1.3s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.ln>span{transform:none}.chip{opacity:1;transform:none}}
@media(max-width:599px){
  .ov.open{align-items:stretch}
  .modal{max-width:none;height:100vh;height:100dvh;max-height:none;border-radius:0;border:0;padding:calc(18px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom))}
  #pay:not([hidden]){display:flex;flex-direction:column;min-height:100%}
  #pay #send{margin-top:auto}
  .ok:not([hidden]){display:flex;flex-direction:column;justify-content:center;min-height:100%}
}
/* Sahifa ochilganda animatsiya yo'q: hamma narsa darhol ko'rinadi */
.logo,.card,.tg,.info,body::before{animation:none}
.ln>span{transform:none;animation:none}
.btn::after{display:none}
.chip{opacity:1;transform:none;transition:border-color .3s,background .3s,color .3s}
/* Asosiy tugma: mijoz e'tiborini tortuvchi silliq yaltiroq nur va yumshoq nafas */
#order{animation:cta 3.2s ease-in-out infinite}
@keyframes cta{0%,100%{box-shadow:0 6px 16px #0007,0 0 0 0 #f3e6d300}50%{box-shadow:0 6px 16px #0007,0 0 32px 3px #f3e6d36e}}
/* Logo yonib turadi: harflar shaklida yumshoq nur "nafas oladi" */
.logo{filter:drop-shadow(0 0 6px #f3e6d355) drop-shadow(0 0 16px #f3e6d330);animation:logoGlow 3.2s ease-in-out infinite}
@keyframes logoGlow{50%{filter:drop-shadow(0 0 9px #f3e6d3cc) drop-shadow(0 0 26px #f3e6d388) brightness(1.12)}}

/* To'lov oynasi foni asosiy sahifa bilan bir xil */
.modal{background:var(--bg) var(--bgimg) center/cover no-repeat}
.back{align-self:flex-start;text-align:left;background:none;border:0;color:var(--muted);font:600 .88rem var(--f-ui);cursor:pointer;padding:8px 12px 8px 0;margin-bottom:2px}
.back:hover,.back:focus-visible{color:var(--text)}
.back:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
.ov.open #pay>:nth-child(11){animation-delay:.58s}
/* To'lov oynasidagi matnlar aniq o'qilsin */
.hint{font:500 .92rem/1.5 var(--f-ui);color:var(--text);background:#150c08b8;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 16px}
#pay label{color:var(--text);font:700 .86rem var(--f-ui);text-shadow:0 1px 8px #000b}
.sum span{font:500 .82rem var(--f-ui);color:#d6c4ab}
.hint{color:var(--bg);background:#fbf6ec;border-color:#fffa;font-weight:600;box-shadow:0 6px 18px #0006}
.hint{background:linear-gradient(110deg,var(--cream2),var(--cream1));color:var(--ink);border:0;box-shadow:0 6px 16px #0007}
.cardrow{background:linear-gradient(110deg,var(--cream2),var(--cream1));border:0;box-shadow:0 6px 16px #0007}
.cardrow em{color:#5b4630;font-weight:600}
.cardrow code{color:var(--ink)}
.copy{border-color:var(--ink);color:var(--ink);font-weight:700}
/* Karta bloki va izoh bitta butun blok bo'lib qo'shilib turadi */
.cardrow{margin-bottom:0;border-radius:12px 12px 0 0;box-shadow:0 -2px 12px -4px #0006}
.hint{margin-top:0;border-radius:0 0 12px 12px;border-top:1px solid #2a1b0f24;box-shadow:0 8px 16px -4px #0007}
</style>

  open:()=>[N.C5,N.E5,N.G5].forEach((f,i)=>bell(f,i*.08,.08,1.1)),
  close:()=>{bell(N.G5,0,.06,.6);bell(N.C5,.07,.06,.8)},
  success:()=>{[N.C5,N.E5,N.G5,N.C6,N.E6].forEach((f,i)=>bell(f,i*.1,.08,1.6));bell(N.C6,.55,.05,2)},
  welcome:()=>{bell(N.C5,0,.06,2);bell(N.G5,.12,.05,2);bell(N.E6,.26,.035,2.2)},
  err:()=>bell(196,0,.1,.7)};
let woke=false;
const wake=()=>{if(woke)return;woke=true;ac();snd.welcome()};
["pointerdown","touchend","click","keydown"].forEach(ev=>addEventListener(ev,wake,{passive:true}));
document.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".btn,.chip,.copy");if(!b)return;
  if(b.matches(".btn"))snd.tap();
  const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),x=document.createElement("span");
  x.className="rip";x.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(x);setTimeout(()=>x.remove(),800)},{passive:true});
const total=()=>k*SITE.PRICE_PER_K;

document.title="AuraSahifa — "+T.title.replace(/\s+/g," ").toLowerCase();
$("title").innerHTML=T.title.split("\n").map((l,i)=>`<span class="ln"><span style="animation-delay:${(.55+i*.14).toFixed(2)}s">${l}</span></span>`).join(""); 
$("igLabel").textContent=T.igLabel; $("ig").placeholder=T.igPlaceholder;
$("order").textContent=T.order; $("mt").textContent=T.payTitle;
$("payHint").textContent=T.payHint; $("fileLabel").textContent=T.fileLabel; $("pick").textContent=T.pick; $("back").textContent="\u2190 "+T.back;
$("send").textContent=T.confirm; $("okTitle").textContent=T.okTitle; $("okText").textContent=T.okText;
$("tgTop").textContent=T.tgTop; $("tgTop").href=igUrl(); $("tgDone").href=igUrl(); $("tgDone").textContent=T.tgDone; $("info").textContent=T.info;

const fit=el=>{el.style.fontSize="";let z=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&z>11){z-=.5;el.style.fontSize=z+"px"}};
const range=$("range"); range.value=k;
SITE.QUICK.forEach((v,i)=>{
  const b=document.createElement("button");
  b.type="button"; b.className="chip"; b.dataset.k=v;
  b.innerHTML=`${v}K<small>${fmt(v*SITE.PRICE_PER_K)}</small>`;
  b.onclick=()=>{k=v;render(true);snd.pick()}; b.style.transitionDelay=(1.15+i*.07).toFixed(2)+"s"; $("chips").appendChild(b); setTimeout(()=>b.classList.add("show"),30); setTimeout(()=>b.style.transitionDelay="",2800);
});
let shown=0,tw=0;
const setRes=v=>{$("result").textContent=`${k}K ${T.word} — ${fmt(Math.round(v/1000)*1000)} UZS`;fit($("result"))};
function render(an){
  const to=total();cancelAnimationFrame(tw);
  if(an===true&&shown&&!matchMedia("(prefers-reduced-motion: reduce)").matches){
    const from=shown,t0=performance.now();
    const step=n=>{const p=Math.min(1,(n-t0)/560),e=1-Math.pow(1-p,3);setRes(from+(to-from)*e);if(p<1)tw=requestAnimationFrame(step)};
    tw=requestAnimationFrame(step)
  }else setRes(to);
  shown=to;
  $("sub").textContent=`${fmt(k*1000)} ta obunaçi`;
  range.value=k; range.style.setProperty("--p",((k-1)/99*100)+"%");
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",+c.dataset.k===k));
}
let lt=0;range.oninput=()=>{k=+range.value;render();const n=performance.now();if(n-lt>70){lt=n;snd.tick(k)}};
render();
document.fonts&&document.fonts.ready.then(render);
addEventListener("resize",()=>fit($("result")));

SITE.CARDS.forEach(c=>{
  const d=document.createElement("div"); d.className="cardrow";
  d.innerHTML=`<div><em>${c.name} · ${c.owner}</em><code>${c.number}</code></div><button type="button" class="copy">Nusxa</button>`;
  d.querySelector(".copy").onclick=e=>{
    navigator.clipboard&&navigator.clipboard.writeText(c.number.replace(/\s/g,""));
    snd.tick(40);e.target.textContent="Nusxalandi"; setTimeout(()=>e.target.textContent="Nusxa",1500);
  };
  $("cards").appendChild(d);
});

const igName=v=>{v=v.trim().replace(/^(https?:\/\/)?(www\.)?instagram\.com\//i,"").split(/[?\/#]/)[0].replace(/^@/,"");return /^[A-Za-z0-9._]{1,30}$/.test(v)?v:""};
$("order").onclick=()=>{
  const v=$("ig").value.trim();
  const nm=igName(v);
  if(!nm){$("igErr").textContent="Instagram sahifa nomini yozing, masalan: @sahifa_nomi";$("ig").focus();snd.err();return}
  $("igErr").textContent="";
  order={k,amount:total(),link:"https://instagram.com/"+nm};
  $("sumLabel").textContent=`${order.k}K ${T.word.toLowerCase()}`;
  $("sumAmt").textContent=fmt(order.amount)+" UZS";
  $("pay").hidden=false; $("done").hidden=true; try{history.pushState({pay:1},"")}catch(e){} $("ov").classList.add("open"); snd.open();
};
const hideM=()=>{if($("ov").classList.contains("open"))snd.close();$("ov").classList.remove("open")};
const closeM=()=>{if(history.state&&history.state.pay)history.back();else hideM()};
addEventListener("popstate",hideM);
$("back").onclick=closeM;
$("close").onclick=closeM;
$("ov").onclick=e=>{if(e.target.id==="ov")closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});

$("file").onchange=()=>{
  const f=$("file").files[0],p=$("prev"); $("fErr").textContent=""; $("pick").textContent=f?f.name:T.pick;
  if(f){p.src=URL.createObjectURL(f);p.style.display="block"}else p.style.display="none";
};
function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const s=Math.min(1,1200/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL("image/jpeg",.75));
    };
    img.onerror=()=>rej(new Error("rasm")); img.src=URL.createObjectURL(file);
  });
}
$("send").onclick=async()=>{
  const f=$("file").files[0];
  if(!f||!f.type.startsWith("image/")){$("fErr").textContent="Çek rasmini (skrinşot) yuklang.";return}
  if(!SITE.SCRIPT_URL){$("fErr").textContent="Sayt hali sozlanmagan: SCRIPT_URL kiritilmagan.";return}
  const btn=$("send"); btn.disabled=true; btn.textContent="Yuborilmoqda...";
  try{
    const fileData=await compress(f), fileName=f.name.replace(/\.[^.]+$/,"")+".jpg";
    await fetch(SITE.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({count:order.k+"K",price:order.amount,link:order.link,fileData,fileName})});
    $("pay").hidden=true; $("done").hidden=false; snd.success();
    $("file").value=""; $("prev").style.display="none"; $("pick").textContent=T.pick;
  }catch(e){snd.err();$("fErr").textContent="Yuborib bölmadi. Internetni tekşirib, qayta urinib köring.";console.error(e)}
  btn.disabled=false; btn.textContent=T.confirm;
};
</script>
</body>
</html>
